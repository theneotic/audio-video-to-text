<!doctype html>
<html lang="en" class="h-full bg-paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <title>{% block title %}Media to Text{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['Source Serif 4', 'Georgia', 'serif'],
            mono: ['DM Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            paper: '#f4f1ea',
            ink: '#20292b',
            moss: '#5d6b5f',
            rust: '#b65f3b',
            line: '#d9d1c3',
            wash: '#ebe6dc',
          },
          boxShadow: {
            paper: '0 12px 30px rgba(50, 45, 35, .08)',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="min-h-full bg-paper font-sans text-ink antialiased">
  {% block body %}{% endblock %}
  <script>
    document.addEventListener('change', function (event) {
      if (event.target.id !== 'file') return;
      const name = event.target.files && event.target.files[0] ? event.target.files[0].name : 'Choose a file';
      const target = document.getElementById('file-name');
      if (target) target.textContent = name;
      const zone = document.getElementById('drop-zone');
      if (zone) zone.classList.toggle('has-file', Boolean(event.target.files && event.target.files.length));
    });
  </script>
</body>
</html>
