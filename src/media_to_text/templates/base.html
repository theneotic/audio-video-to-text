<!doctype html>
<html lang="en" class="h-full bg-[#08111d]">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111d">
  <title>{% block title %}Media to Text{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            ink: '#08111d',
            panel: '#101d2c',
            teal: '#5eead4',
            coral: '#fb7185',
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(94, 234, 212, .15), 0 24px 80px rgba(0, 0, 0, .30)',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="min-h-full overflow-x-hidden bg-ink font-sans text-slate-100 antialiased">
  <div class="pointer-events-none fixed inset-0 -z-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -left-24 -top-40 h-[34rem] w-[34rem] rounded-full bg-teal/10 blur-3xl"></div>
    <div class="absolute -bottom-56 -right-32 h-[34rem] w-[34rem] rounded-full bg-coral/10 blur-3xl"></div>
    <div class="absolute inset-0 opacity-[0.035] [background-image:linear-gradient(rgba(255,255,255,.8)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,.8)_1px,transparent_1px)] [background-size:48px_48px]"></div>
  </div>
  {% block body %}{% endblock %}
  <script>
    document.addEventListener('change', function (event) {
      if (event.target.id !== 'file') return;
      const name = event.target.files && event.target.files[0] ? event.target.files[0].name : 'Select a file to begin';
      const target = document.getElementById('file-name');
      if (target) target.textContent = name;
      const zone = document.getElementById('drop-zone');
      if (zone) zone.classList.toggle('has-file', Boolean(event.target.files && event.target.files.length));
    });
  </script>
</body>
</html>
